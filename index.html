<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Kartvizit</title>
<style>
  :root {
    --accent: #6c5ce7;
    --accent-2: #00cec9;
    --text: #1e1e2e;
    --muted: #6b6b7b;
    --bg: #eef0fb;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top left, #dfe4ff, var(--bg) 60%);
    color: var(--text);
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(60, 60, 120, 0.18);
    overflow: hidden;
    position: relative;
  }

  .banner {
    height: 110px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    position: relative;
  }

  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #dcdcf5 url('https://via.placeholder.com/100x100.png?text=Foto') center/cover;
    border: 5px solid var(--card-bg);
    position: absolute;
    left: 50%;
    top: 70px;
    transform: translateX(-50%);
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }

  .content {
    padding: 66px 28px 28px;
    text-align: center;
  }

  .name {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .title {
    font-size: 0.95rem;
    color: var(--muted);
    margin: 0 0 2px;
  }

  .company {
    font-size: 0.9rem;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 20px;
  }

  .divider {
    height: 1px;
    background: #eee;
    margin: 20px 0;
  }

  .info-list {
    list-style: none;
    padding: 0;
    margin: 0 0 24px;
    text-align: left;
  }

  .info-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    font-size: 0.92rem;
  }

  .info-list a {
    color: var(--text);
    text-decoration: none;
  }

  .info-list a:hover {
    color: var(--accent);
  }

  .icon {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    border-radius: 10px;
    background: #f2f1ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .socials a {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #f2f1ff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .socials a:hover {
    background: var(--accent);
    color: #fff;
    transform: translateY(-2px);
  }

  .actions {
    display: flex;
    gap: 12px;
  }

  .btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 14px;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }

  .btn-secondary {
    background: #f2f1ff;
    color: var(--accent);
  }

  .btn:hover {
    opacity: 0.9;
  }

  .form-actions .btn {
    font-size: 0.8rem;
    padding: 12px 4px;
  }

  .qr-section {
    width: 100%;
    max-width: 380px;
    margin: 16px auto 0;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(60, 60, 120, 0.18);
    padding: 20px;
    text-align: center;
  }

  .qr-box {
    display: inline-block;
    padding: 12px;
    background: #fff;
    border-radius: 12px;
  }

  .qr-caption {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .card-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-field label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
  }

  .form-field input {
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid #e2e2f0;
    background: #f9f9fd;
    font-size: 0.9rem;
    color: var(--text);
    font-family: inherit;
  }

  .form-field input:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }

  .form-error {
    font-size: 0.75rem;
    color: #e5484d;
  }

  .form-status {
    margin: 0;
    font-size: 0.85rem;
    text-align: center;
  }

  .form-status.success {
    color: var(--accent-2);
  }

  .form-status.error {
    color: #e5484d;
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
></script>
<script src="src/config.js"></script>
<script type="text/babel" src="src/components/QrCode.js"></script>
<script type="text/babel" src="src/components/ContactForm.js"></script>

<script type="text/babel" data-type="module">
const { useState } = React;

const PERSON = {
  id: "ulgen-benli",
  name: "Ülgen Benli",
  title: "Makine Mühendisi, Mindfulness Eğitmeni",
  photoUrl: "https://via.placeholder.com/100x100.png?text=Foto",
  location: "Ankara, Türkiye",
  contacts: [
    { icon: "📞", label: "+90 555 555 55 55", href: "tel:+905555555555" },
    { icon: "✉️", label: "ulgenbenli@gmail.com", href: "mailto:ulgenbenli@gmail.com" },
    { icon: "🌐", label: "https://ulgenbenli.teachfluence.com/", href: "https://ulgenbenli.teachfluence.com/" },
    { icon: "📍", label: "Ankara, Türkiye" }
  ],
  socials: [
    { label: "in", title: "LinkedIn", href: "#" },
    { label: "IG", title: "Instagram", href: "#" }
  ]
};

function Avatar({ photoUrl }) {
  return (
    <React.Fragment>
      <div className="banner"></div>
      <div
        className="avatar"
        style={{ backgroundImage: `url('${photoUrl}')` }}
      ></div>
    </React.Fragment>
  );
}

function ContactList({ contacts }) {
  return (
    <ul className="info-list">
      {contacts.map((contact, index) => (
        <li key={index}>
          <span className="icon">{contact.icon}</span>
          {contact.href ? (
            <a
              href={contact.href}
              target={contact.href.startsWith("http") ? "_blank" : undefined}
              rel={contact.href.startsWith("http") ? "noopener" : undefined}
            >
              {contact.label}
            </a>
          ) : (
            <span>{contact.label}</span>
          )}
        </li>
      ))}
    </ul>
  );
}

function downloadVCard(person) {
  const [firstName, ...rest] = person.name.split(" ");
  const lastName = rest.join(" ");
  const phone = person.contacts.find(c => c.href && c.href.startsWith("tel:"));
  const email = person.contacts.find(c => c.href && c.href.startsWith("mailto:"));
  const website = person.contacts.find(c => c.href && c.href.startsWith("http"));

  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${lastName};${firstName};;;`,
    `FN:${person.name}`,
    `TITLE:${person.title}`,
    phone ? `TEL;TYPE=CELL:${phone.href.replace("tel:", "")}` : null,
    email ? `EMAIL:${email.href.replace("mailto:", "")}` : null,
    website ? `URL:${website.href}` : null,
    person.location ? `ADR:;;${person.location};;;;` : null,
    "END:VCARD"
  ].filter(Boolean).join("\n");

  const blob = new Blob([vcard], { type: "text/vcard" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `${person.name.replace(/\s+/g, "-").toLowerCase()}.vcf`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function shareCard(person) {
  if (navigator.share) {
    navigator.share({
      title: `${person.name} - Dijital Kartvizit`,
      text: "Dijital kartvizitimi görüntüle",
      url: window.location.href
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => {
      alert("Link kopyalandı!");
    });
  }
}

function ProfileCard({ person }) {
  return (
    <div className="card">
      <Avatar photoUrl={person.photoUrl} />

      <div className="content">
        <h1 className="name">{person.name}</h1>
        <p className="title">{person.title}</p>

        <div className="divider"></div>

        <ContactList contacts={person.contacts} />

        <div className="socials">
          {person.socials.map((social, index) => (
            <a key={index} href={social.href} target="_blank" rel="noopener" title={social.title}>
              {social.label}
            </a>
          ))}
        </div>

        <div className="actions">
          <button className="btn btn-primary" onClick={() => downloadVCard(person)}>
            📇 Rehbere Ekle
          </button>
          <button className="btn btn-secondary" onClick={() => shareCard(person)}>
            🔗 Paylaş
          </button>
        </div>

        <div className="divider"></div>

        <ContactForm card={{ id: person.id, name: person.name, url: window.location.href }} />

      </div>
    </div>
  );
}

function App() {
  return (
    <React.Fragment>
      <ProfileCard person={PERSON} />
      <QrCode value={window.location.href} />
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

</body>
</html>
